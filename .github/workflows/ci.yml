name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: none

      - name: Lint PHP
        run: |
          find app/src app/public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create app config
        run: |
          cat > app/config.json <<'EOF'
          {
            "db_host": "127.0.0.1",
            "db_user": "root",
            "db_senha": "dummy",
            "db_banco": "sgreserva",
            "db_porta": 3306,
            "url_base_path": "/"
          }
          EOF

      - name: Run tests
        run: vendor/bin/phpunit
